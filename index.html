<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Eclipse</title>
<script>
(function() {
  function showFatalError(msg) {
    var d = document.getElementById("__fatal_error__");
    if (!d) {
      d = document.createElement("div");
      d.id = "__fatal_error__";
      d.style.cssText = "position:fixed;inset:0;z-index:999999;background:#1a0000;color:#ff9a9a;padding:16px;font-family:monospace;font-size:12px;white-space:pre-wrap;overflow:auto;line-height:1.5;";
      var title = document.createElement("div");
      title.textContent = "\u041E\u0428\u0418\u0411\u041A\u0410 \u0417\u0410\u0413\u0420\u0423\u0417\u041A\u0418 \u2014 \u0441\u043A\u0440\u0438\u043D\u0448\u043E\u0442 \u044D\u0442\u043E\u0433\u043E \u044D\u043A\u0440\u0430\u043D\u0430 \u0438 \u043E\u0442\u043F\u0440\u0430\u0432\u044C\u0442\u0435 \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u0447\u0438\u043A\u0443:";
      title.style.cssText = "color:#fff;font-weight:bold;margin-bottom:10px;font-family:sans-serif;font-size:14px;";
      d.appendChild(title);
      var body = document.createElement("div");
      body.id = "__fatal_error_body__";
      d.appendChild(body);
      (document.body || document.documentElement).appendChild(d);
    }
    var body = document.getElementById("__fatal_error_body__");
    var line = document.createElement("div");
    line.style.cssText = "margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #440000;";
    line.textContent = msg;
    body.appendChild(line);
  }
  window.addEventListener("error", function(e) {
    showFatalError((e.message || "Unknown error") + "\n\u0424\u0430\u0439\u043B: " + (e.filename || "?") + ":" + (e.lineno || "?") + ":" + (e.colno || "?"));
  });
  window.addEventListener("unhandledrejection", function(e) {
    var r = e.reason;
    showFatalError("Promise error: " + (r && (r.message || r.toString()) || String(r)));
  });
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
input,textarea{user-select:text;}
:root{
  --bg:#000000;--bg2:#0c0c0e;--text:#f5f5f7;--dim:#8a8a8f;
  --accent:#ffffff;--accent2:#a8a8ad;
  --glass-bg:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.12);
  --blur:20px;--r:20px;--r-sm:12px;
  --shadow:0 12px 40px rgba(0,0,0,0.55);
  --p1:#ffffff;--p2:#9c9ca3;--p3:#4a4a4f;
  --danger:#ff5c5c;
}
html,body{height:100%;}
body{
  font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);
  height:100dvh;overflow:hidden;position:relative;
  transition:background .4s ease,color .4s ease;
}
.no-anim *{animation-duration:.001s !important;transition-duration:.001s !important;}
#root{height:100%;position:relative;z-index:1;}

/* PARTICLES + GLOW */
#particleCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.35;animation:float 22s ease-in-out infinite;}
@keyframes float{0%{transform:translate(0,0) scale(1);}33%{transform:translate(6%,8%) scale(1.12);}66%{transform:translate(-5%,-6%) scale(0.9);}100%{transform:translate(0,0) scale(1);}}
.b1{width:320px;height:320px;top:-90px;left:-70px;background:var(--p1);}
.b2{width:280px;height:280px;bottom:-50px;right:-50px;background:var(--p2);animation-delay:-8s;}
.b3{width:240px;height:240px;top:42%;left:28%;background:var(--p3);animation-delay:-14s;}

.glass{background:var(--glass-bg);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);border:1px solid var(--glass-border);}

/* SCREEN TRANSITIONS */
.screen-wrap{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--glass-bg);}
@keyframes screenIn{from{opacity:0;transform:translateX(26px) scale(.99);}to{opacity:1;transform:translateX(0) scale(1);}}
.screen-anim{animation:screenIn .38s cubic-bezier(.22,1,.36,1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.stagger>*{animation:fadeUp .42s cubic-bezier(.22,1,.36,1) both;}

/* TOPBAR */
.topbar{padding:52px 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--glass-border);flex-shrink:0;position:relative;overflow:hidden;}
.topbar-title{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:800;}
.back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim);flex-shrink:0;transition:background .15s,transform .12s;position:relative;overflow:hidden;}
.back-btn:active{transform:scale(.88);background:var(--glass-border);}
.back-btn svg{width:20px;height:20px;}

/* HOME */
.home-header{padding:58px 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.home-logo{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:800;letter-spacing:.01em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-actions{display:flex;gap:8px;}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim);transition:color .15s,background .15s,transform .12s;position:relative;overflow:visible;}
.icon-btn:active{background:var(--glass-border);color:var(--text);transform:scale(.9);}
.icon-btn svg{width:20px;height:20px;}
.badge-dot{position:absolute;top:4px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);animation:pulseDot 1.8s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.35);opacity:.6;}}

.section-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim);padding:16px 20px 8px;text-transform:uppercase;}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.scroll-area::-webkit-scrollbar{display:none;}

/* ROWS */
.server-row{display:flex;align-items:center;gap:14px;padding:12px 20px;cursor:pointer;transition:background .15s;position:relative;}
.server-row:active{background:var(--glass-border);}
.server-avatar{width:52px;height:52px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--accent),var(--accent2));}
.server-avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.server-avatar-text{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;color:#000;position:relative;z-index:1;}
.server-info{flex:1;min-width:0;}
.server-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.server-sub{font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chevron{color:var(--dim);flex-shrink:0;}
.chevron svg{width:16px;height:16px;}
.unread-pill{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--accent);color:#000;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* FAB */
.fab{position:fixed;right:20px;bottom:104px;z-index:20;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 28px -6px rgba(255,255,255,.35);transition:transform .18s cubic-bezier(.34,1.56,.64,1);}
.fab:active{transform:scale(0.88) rotate(90deg);}
.fab svg{width:26px;height:26px;color:#000;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;padding:10px 0 28px;border-top:1px solid var(--glass-border);overflow:hidden;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--dim);transition:color .15s;position:relative;}
.nav-item.active{color:var(--text);}
.nav-item svg{width:22px;height:22px;transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
.nav-item.active svg{transform:translateY(-2px) scale(1.08);}
.nav-label{font-size:10px;font-weight:600;}
.nav-badge{position:absolute;top:-3px;right:22%;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--accent);color:#000;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;}

/* CHANNELS */
.channel-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 12px;}
.channel-list::-webkit-scrollbar{display:none;}
.cat-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--dim);padding:14px 10px 6px;text-transform:uppercase;}
.chan-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r-sm);color:var(--dim);font-size:15px;cursor:pointer;margin-bottom:2px;transition:background .15s,color .15s;position:relative;}
.chan-row:active{background:var(--glass-border);color:var(--text);}
.chan-row svg{width:17px;height:17px;flex-shrink:0;}
.chan-name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.locked-badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,0.08);color:var(--dim);flex-shrink:0;}
.chan-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}

/* EMPTY */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 30px;text-align:center;}
.empty-icon{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--glass-border);margin-bottom:4px;}
.empty-icon svg{width:30px;height:30px;color:var(--text);}
.empty-title{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:800;}
.empty-sub{font-size:14px;color:var(--dim);line-height:1.6;max-width:280px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.55);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{width:100%;border-radius:28px 28px 0 0;padding:20px 20px 44px;max-height:82vh;overflow-y:auto;transform:translateY(100%);transition:transform .36s cubic-bezier(.22,1,.36,1);background:var(--bg2);border-top:1px solid var(--glass-border);position:relative;}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--glass-border);margin:0 auto 20px;}
.modal-title{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:800;margin-bottom:18px;}
.field-label{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.text-input{width:100%;padding:13px 16px;border-radius:var(--r-sm);border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--text);font-size:15px;font-family:'Manrope',sans-serif;outline:none;margin-bottom:16px;transition:border-color .15s;}
.text-input:focus{border-color:var(--accent);}
.text-input::placeholder{color:var(--dim);}
.select-input{width:100%;padding:13px 16px;border-radius:var(--r-sm);border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--text);font-size:15px;font-family:'Manrope',sans-serif;outline:none;margin-bottom:16px;appearance:none;}
.select-input option{background:#1a1a1c;color:#f5f5f7;}

.avatar-picker{width:90px;height:90px;border-radius:24px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px dashed var(--glass-border);overflow:hidden;position:relative;transition:border-color .2s;}
.avatar-picker:active{border-color:var(--accent);}
.avatar-picker img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.avatar-picker-label{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--dim);}
.avatar-picker-label svg{width:24px;height:24px;}
.avatar-picker-label span{font-size:11px;font-weight:600;}
.hidden-input{display:none;}

.btn{width:100%;padding:15px;border-radius:var(--r-sm);font-size:15px;font-weight:700;font-family:'Manrope',sans-serif;cursor:pointer;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;box-shadow:0 6px 22px -6px rgba(255,255,255,.3);transition:transform .15s,opacity .15s;margin-top:4px;position:relative;overflow:hidden;}
.btn:active{transform:scale(0.97);opacity:0.9;}
.btn:disabled{opacity:.4;pointer-events:none;}
.btn-ghost{background:var(--glass-border);color:var(--text);box-shadow:none;margin-top:8px;}
.btn-danger{background:linear-gradient(135deg,#ff5c5c,#ff8a8a);box-shadow:0 6px 20px -4px rgba(255,92,92,.4);color:#1a0000;margin-top:8px;}

/* RIPPLE */
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rippleAnim .55s ease-out;pointer-events:none;}
@keyframes rippleAnim{to{transform:scale(2.6);opacity:0;}}

/* PROFILE */
.profile-hero{padding:56px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;}
.profile-avatar{width:90px;height:90px;border-radius:28px;position:relative;cursor:pointer;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--status-color,#4ade80);animation:breathe 3.2s ease-in-out infinite;}
@keyframes breathe{0%,100%{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--status-color,#4ade80);}50%{box-shadow:0 0 0 3px var(--bg),0 0 0 7px var(--status-color,#4ade80);}}
.profile-avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.profile-avatar-edit{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);font-size:10.5px;font-weight:700;text-align:center;padding:5px 0;color:#fff;}
.profile-name{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:800;}
.profile-bio{font-size:13px;color:var(--dim);text-align:center;max-width:260px;}
.role-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.status-row{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);cursor:pointer;padding:4px 10px;border-radius:20px;transition:background .15s;}
.status-row:active{background:var(--glass-border);}
.status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.profile-sections{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 40px;}
.profile-sections::-webkit-scrollbar{display:none;}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--r-sm);margin-bottom:2px;cursor:pointer;transition:background .15s;}
.setting-row:active{background:var(--glass-border);}
.setting-row-left{display:flex;align-items:center;gap:12px;min-width:0;}
.setting-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--glass-border);flex-shrink:0;}
.setting-icon svg{width:18px;height:18px;color:var(--text);}
.setting-name{font-size:14.5px;font-weight:600;}
.setting-desc{font-size:12px;color:var(--dim);margin-top:1px;}
.setting-chevron{color:var(--dim);flex-shrink:0;}
.setting-chevron svg{width:16px;height:16px;}

/* SWITCH */
.switch{width:44px;height:26px;border-radius:14px;background:var(--glass-border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 6px rgba(0,0,0,.3);}
.switch.on .switch-knob{transform:translateX(18px);background:#000;}

.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.theme-card{padding:14px;border-radius:var(--r-sm);cursor:pointer;border:1.5px solid transparent;transition:border-color .2s,transform .15s;}
.theme-card:active{transform:scale(.96);}
.theme-card.active{border-color:var(--accent);}
.theme-dot{width:28px;height:28px;border-radius:50%;margin-bottom:8px;border:1px solid var(--glass-border);}
.theme-name{font-size:13px;font-weight:700;}

.opt-row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:var(--r-sm);cursor:pointer;margin-bottom:6px;transition:background .15s;}
.opt-row:active{background:var(--glass-border);}
.opt-row.sel{background:var(--glass-border);}
.opt-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.opt-radio.on{border-color:var(--accent);}
.opt-radio.on::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent);}

/* TOAST */
.toast-stack{position:fixed;top:56px;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.toast{padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;box-shadow:0 8px 24px -4px rgba(255,255,255,.25);animation:toastIn .3s cubic-bezier(.22,1,.36,1),toastOut .3s ease .2s;animation-fill-mode:forwards;max-width:88vw;text-align:center;}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.9);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes toastOut{0%,80%{opacity:1;}100%{opacity:1;}}

/* ROLE COLORS */
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.role-owner{background:#f7c94826;color:#f7c948;}
.role-admin{background:rgba(255,255,255,.14);color:#f0f0f2;}
.role-mod{background:rgba(255,255,255,.1);color:#d6d6db;}
.role-member{background:rgba(255,255,255,0.07);color:var(--dim);}

/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;z-index:1000;background:radial-gradient(ellipse at 50% 30%,#0a0a14 0%,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;overflow:hidden;transition:opacity .5s ease,transform .5s ease;}
.splash.leaving{opacity:0;transform:scale(1.06);pointer-events:none;}
.splash-stars{position:absolute;inset:0;overflow:hidden;}
.splash-stars span{position:absolute;border-radius:50%;background:#fff;opacity:.15;animation:starTwinkle 2.6s ease-in-out infinite;}
@keyframes starTwinkle{0%,100%{opacity:.1;}50%{opacity:.85;}}
.splash-eclipse{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;}
.eclipse-rays{position:absolute;width:180px;height:180px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,214,140,.16) 0deg 4deg,transparent 4deg 18deg);animation:raysSpin 40s linear infinite;}
@keyframes raysSpin{to{transform:rotate(360deg);}}
.eclipse-corona{position:absolute;width:98px;height:98px;border-radius:50%;box-shadow:0 0 40px 14px rgba(255,210,140,.15);opacity:.15;animation:coronaPulse 4s ease-in-out infinite alternate;}
@keyframes coronaPulse{0%{opacity:.12;box-shadow:0 0 30px 10px rgba(255,210,140,.12);}100%{opacity:1;box-shadow:0 0 70px 26px rgba(255,225,170,.55);}}
.eclipse-sun{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff8e6,#ffd27a 55%,#ff9d4d 100%);box-shadow:0 0 24px rgba(255,190,110,.55);position:relative;z-index:1;}
.eclipse-moon{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 62% 68%,#2c2c34,#0a0a0d 70%);position:relative;z-index:2;margin-left:-76px;box-shadow:inset 4px -4px 10px rgba(255,255,255,.04);animation:eclipseSlide 4s ease-in-out infinite alternate;}
.eclipse-flare{position:absolute;top:50%;left:50%;margin-top:-7px;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:#fff;filter:blur(1px);opacity:0;z-index:3;animation:flareBurst 4s ease-in-out infinite alternate;}
@keyframes flareBurst{0%{opacity:0;transform:scale(.4);}42%{opacity:0;transform:scale(.4);}50%{opacity:1;transform:scale(2.4);box-shadow:0 0 30px 14px rgba(255,240,210,.7);}58%{opacity:0;transform:scale(.4);}100%{opacity:0;transform:scale(.4);}}
.splash-shooting{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;box-shadow:0 0 6px 1px rgba(255,255,255,.8);}
.splash-shooting::before{content:"";position:absolute;top:0;right:0;width:70px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.8));transform:translateX(100%);}
.splash-shooting.s1{top:18%;left:12%;animation:shootAcross 5.5s ease-in 1.2s infinite;}
.splash-shooting.s2{top:64%;left:70%;animation:shootAcross 6.5s ease-in 3.4s infinite;}
@keyframes shootAcross{0%{opacity:0;transform:translate(0,0);}2%{opacity:1;}12%{opacity:0;transform:translate(120px,70px);}100%{opacity:0;}}
.splash-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,210,150,0) 0%,rgba(255,210,150,0) 55%,rgba(0,0,0,.35) 100%);animation:vignettePulse 4s ease-in-out infinite alternate;}
@keyframes vignettePulse{0%{opacity:.4;}100%{opacity:.9;}}
.splash-eclipse{animation:eclipseBreathe 4s ease-in-out infinite alternate;}
@keyframes eclipseBreathe{0%{transform:scale(1);}100%{transform:scale(1.04);}}
@keyframes eclipseSlide{0%{transform:translateX(-66px);}100%{transform:translateX(66px);}}
.splash-word{font-family:'Unbounded',sans-serif;font-size:26px;font-weight:800;letter-spacing:.04em;display:flex;}
.splash-word span{opacity:0;transform:translateY(10px);animation:letterIn .5s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes letterIn{to{opacity:1;transform:translateY(0);}}
.splash-bar-track{width:180px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;}
.splash-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#fff,#b9c4ff);border-radius:2px;transition:width .1s linear;}
.splash-pct{font-size:11px;color:#7a7a80;letter-spacing:.08em;font-weight:700;}
.splash-skip{position:absolute;bottom:46px;font-size:12px;color:#5a5a60;opacity:0;animation:fadeIn2 .5s ease 3s forwards;cursor:pointer;}
@keyframes fadeIn2{to{opacity:1;}}

/* ===== AUTH ===== */
.auth-wrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding:0 26px;background:transparent;}
.auth-top{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;}
.auth-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#fff,#9c9ca3);display:flex;align-items:center;justify-content:center;margin-bottom:18px;animation:fadeUp .5s ease;box-shadow:0 10px 30px -8px rgba(255,255,255,.35);}
.auth-logo svg{width:32px;height:32px;color:#000;}
.auth-title{font-family:'Unbounded',sans-serif;font-size:23px;font-weight:800;animation:fadeUp .5s ease .05s both;}
.auth-sub{font-size:14px;color:var(--dim);line-height:1.6;margin-bottom:10px;animation:fadeUp .5s ease .1s both;}
.phone-input-row{display:flex;gap:8px;animation:fadeUp .5s ease .15s both;}
.phone-prefix{padding:13px 14px;border-radius:var(--r-sm);border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);font-weight:700;font-size:15px;}
.code-row{display:flex;gap:8px;margin:6px 0 4px;animation:fadeUp .5s ease .15s both;}
.code-box{width:100%;aspect-ratio:1;text-align:center;font-size:19px;font-weight:800;border-radius:14px;border:1.5px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--text);outline:none;transition:border-color .15s,transform .15s;}
.code-box:focus{border-color:var(--accent);transform:scale(1.04);}
.code-box.shake{animation:shakeX .4s ease;}
@keyframes shakeX{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
.auth-bottom{padding-bottom:44px;animation:fadeUp .5s ease .2s both;}
.onb-wrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:space-between;padding:70px 28px 46px;background:transparent;overflow:hidden;}
.onb-skip{align-self:flex-end;font-size:12.5px;color:var(--dim);cursor:pointer;padding:6px 4px;}
.onb-slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;animation:onbIn .45s cubic-bezier(.22,1,.36,1);}
@keyframes onbIn{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:translateX(0);}}
.onb-emoji{font-size:60px;animation:onbEmoji .55s cubic-bezier(.34,1.56,.64,1);}
@keyframes onbEmoji{from{transform:scale(.4) rotate(-12deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.onb-title{font-family:'Unbounded',sans-serif;font-size:23px;font-weight:800;animation:fadeUp .4s ease .1s both;}
.onb-desc{font-size:14px;color:var(--dim);line-height:1.6;max-width:300px;animation:fadeUp .4s ease .18s both;}
.onb-dots{display:flex;justify-content:center;gap:7px;margin:18px 0;}
.onb-dot{width:7px;height:7px;border-radius:50%;background:var(--glass-border);transition:all .32s cubic-bezier(.22,1,.36,1);}
.onb-dot.active{width:22px;border-radius:4px;background:var(--accent);}
.onb-bottom .btn{width:100%;}
.resend-link{text-align:center;font-size:13px;color:var(--dim);margin-top:14px;}
.resend-link b{color:var(--text);cursor:pointer;}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(0,0,0,.25);border-top-color:#000;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;}

/* ===== CHAT ===== */
.chat-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;}
.chat-body::-webkit-scrollbar{display:none;}
.msg-row{display:flex;gap:8px;max-width:86%;animation:msgIn .32s cubic-bezier(.22,1,.36,1);position:relative;}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.msg-row.self{align-self:flex-end;flex-direction:row-reverse;}
.msg-avatar{width:28px;height:28px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,var(--accent2),var(--p3));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#000;margin-top:auto;cursor:pointer;}
.member-card-avatar{width:84px;height:84px;border-radius:22px;margin:6px auto 14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:26px;font-weight:800;color:#000;overflow:hidden;}
.member-card-avatar img{width:100%;height:100%;object-fit:cover;}
.member-card-name{text-align:center;font-size:18px;font-weight:800;margin-bottom:4px;}
.member-card-sub{text-align:center;font-size:13px;color:var(--dim);margin-bottom:18px;}
.msg-link-invite{font-weight:700;}
.msg-col{display:flex;flex-direction:column;gap:3px;min-width:0;}
.msg-row.self .msg-col{align-items:flex-end;}
.msg-meta{font-size:11px;color:var(--dim);padding:0 4px;display:flex;gap:6px;}
.msg-bubble{padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;word-break:break-word;position:relative;}
.msg-row:not(.self) .msg-bubble{background:var(--glass-bg);border:1px solid var(--glass-border);border-bottom-left-radius:5px;}
.msg-row.self .msg-bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border-bottom-right-radius:5px;font-weight:600;}
.msg-reactions{display:flex;gap:4px;margin-top:2px;}
.reaction-chip{font-size:11px;background:var(--glass-border);padding:2px 7px;border-radius:10px;display:flex;gap:3px;align-items:center;}
.react-popover{position:absolute;top:-38px;left:0;display:flex;gap:6px;background:var(--bg2);border:1px solid var(--glass-border);border-radius:20px;padding:6px 8px;box-shadow:var(--shadow);animation:popIn .18s cubic-bezier(.34,1.56,.64,1);z-index:5;}
@keyframes popIn{from{opacity:0;transform:scale(.7) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
.react-emoji{font-size:17px;cursor:pointer;transition:transform .12s;}
.react-emoji:active{transform:scale(1.4);}

.typing-row{display:flex;align-items:center;gap:8px;animation:fadeUp .3s ease;}
.typing-bubble{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;border-bottom-left-radius:5px;padding:12px 14px;display:flex;gap:4px;}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:typingBounce 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:.15s;}
.typing-dot:nth-child(3){animation-delay:.3s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-5px);opacity:1;}}

.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim);text-align:center;padding:30px;}
.chat-empty svg{width:40px;height:40px;opacity:.5;}

.chat-input-bar{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--glass-border);flex-shrink:0;align-items:flex-end;position:relative;}
.chat-textbox{flex:1;padding:11px 16px;border-radius:20px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--text);font-size:14.5px;font-family:'Manrope',sans-serif;outline:none;resize:none;max-height:100px;transition:border-color .15s;}
.chat-textbox:focus{border-color:var(--accent);}
.send-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s,opacity .2s;box-shadow:0 4px 16px -4px rgba(255,255,255,.3);}
.send-btn.disabled{opacity:.35;pointer-events:none;}
.send-btn:active{transform:scale(.88) rotate(-8deg);}
.send-btn svg{width:19px;height:19px;color:#000;}
.locked-input-note{padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center;font-size:12.5px;color:var(--dim);border-top:1px solid var(--glass-border);}

/* VOICE ROOM */
.voice-room{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px 20px;gap:26px;overflow-y:auto;}
.voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:340px;}
.voice-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:18px;background:var(--glass-bg);border:1px solid var(--glass-border);}
.voice-tile.speaking{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.08);}
.voice-tile-av{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--accent2),var(--p3));display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:18px;position:relative;}
.voice-tile.speaking .voice-tile-av::after{content:'';position:absolute;inset:-5px;border-radius:22px;border:2px solid var(--accent);animation:speakPulse 1s ease-in-out infinite;}
@keyframes speakPulse{0%,100%{opacity:.9;transform:scale(1);}50%{opacity:.3;transform:scale(1.08);}}
.voice-tile-name{font-size:12.5px;font-weight:700;text-align:center;}
.voice-bars{display:flex;gap:3px;align-items:flex-end;height:16px;}
.voice-bars span{width:3px;background:var(--accent);border-radius:2px;animation:barWave 1s ease-in-out infinite;}
.voice-bars span:nth-child(1){animation-delay:0s;height:40%;}
.voice-bars span:nth-child(2){animation-delay:.2s;height:100%;}
.voice-bars span:nth-child(3){animation-delay:.4s;height:60%;}
@keyframes barWave{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}
.voice-join-btn{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 30px -8px rgba(255,255,255,.4);transition:transform .18s;}
.voice-join-btn.active{background:linear-gradient(135deg,#ff5c5c,#ff8a8a);}
.voice-join-btn:active{transform:scale(.9);}
.voice-join-btn svg{width:26px;height:26px;color:#000;}

/* SEARCH */
.search-input-wrap{padding:14px 16px;border-bottom:1px solid var(--glass-border);}
.search-input{width:100%;padding:12px 16px;border-radius:20px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--text);font-size:14.5px;outline:none;}
.search-mode-tabs{display:flex;gap:8px;padding:12px 16px 0;}
.search-mode-tab{flex:1;text-align:center;padding:9px 10px;border-radius:14px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.03);color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;}
.search-mode-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border-color:transparent;}
.sr-join-btn{padding:7px 14px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-size:12.5px;font-weight:800;border:none;flex-shrink:0;}
.sr-open-btn{padding:7px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);color:var(--text);font-size:12.5px;font-weight:700;flex-shrink:0;}
.search-result-row{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;transition:background .15s;}
.search-result-row:active{background:var(--glass-border);}
.sr-icon{width:40px;height:40px;border-radius:12px;background:var(--glass-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text);}
.sr-icon svg{width:18px;height:18px;}
.sr-text{min-width:0;}
.sr-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-sub{font-size:12px;color:var(--dim);}

/* NOTIF */
.notif-row{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--glass-border);cursor:pointer;transition:background .15s;}
.notif-row:active{background:var(--glass-border);}
.notif-av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:14px;flex-shrink:0;}
.notif-text{flex:1;min-width:0;}
.notif-title{font-size:13.5px;font-weight:700;}
.notif-sub{font-size:12.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.notif-time{font-size:11px;color:var(--dim);flex-shrink:0;}

/* ===== LIQUID GLASS ===== */
.glass{position:relative;isolation:isolate;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.02);}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.04) 100%);pointer-events:none;}
.topbar::before,.bottom-nav::before,.modal-sheet::before,.chat-input-bar::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(120deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.05) 100%);pointer-events:none;background-size:220% 220%;animation:liquidSheen 9s ease-in-out infinite;}
@keyframes liquidSheen{0%{background-position:0% 0%;}50%{background-position:100% 100%;}100%{background-position:0% 0%;}}
.topbar,.chat-input-bar,.bottom-nav,.modal-sheet{backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);}

/* ===== WAVY INPUT UNDERLINE ===== */
.field-wave-wrap{position:relative;}
.field-wave-wrap.shake{animation:shakeX .4s ease;}
.wavy-underline{height:6px;width:100%;margin-top:-14px;margin-bottom:14px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="6"><path d="M0,3 Q5,0 10,3 T20,3" stroke="black" stroke-width="1.6" fill="none"/></svg>');mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="6"><path d="M0,3 Q5,0 10,3 T20,3" stroke="black" stroke-width="1.6" fill="none"/></svg>');-webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;-webkit-mask-size:20px 6px;mask-size:20px 6px;opacity:0;transition:opacity .25s ease;}
.wavy-underline.active{opacity:1;animation:waveScroll 1s linear infinite;}
.wavy-underline.warn{background:linear-gradient(90deg,var(--danger),#ff8a8a);}
@keyframes waveScroll{from{-webkit-mask-position-x:0;mask-position-x:0;}to{-webkit-mask-position-x:20px;mask-position-x:20px;}}
.field-hint{font-size:11.5px;color:var(--dim);margin:-8px 0 14px;}
.captcha-track{position:relative;height:50px;border-radius:16px;background:var(--glass-bg);border:1px solid var(--glass-border);overflow:hidden;margin:6px 0 16px;user-select:none;touch-action:none;}
.captcha-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.32;}
.captcha-track.verified .captcha-fill{opacity:.9;transition:width .3s cubic-bezier(.22,1,.36,1);}
.captcha-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.01em;pointer-events:none;transition:color .2s;}
.captcha-track.verified .captcha-label{color:#000;}
.captcha-handle{position:absolute;top:2px;left:2px;width:46px;height:46px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.3);color:#000;}
.captcha-track.verified .captcha-handle{transition:transform .3s cubic-bezier(.34,1.56,.64,1);background:#000;color:#fff;}
.captcha-handle:active{cursor:grabbing;}
.captcha-handle svg{width:18px;height:18px;}
.field-hint.warn{color:var(--danger);}

/* ===== MESSAGE ACTIONS, REPLY, FORWARD, PIN, RECEIPTS ===== */
.msg-row{scroll-margin:80px;}
.msg-row.flash-highlight .msg-bubble{animation:flashHi 1.1s ease;}
@keyframes flashHi{0%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:0 0 0 0 transparent;}}
.msg-bubble.deleted-msg{opacity:.55;font-style:italic;}
.msg-reply-quote{display:flex;flex-direction:column;gap:1px;padding:6px 9px;margin-bottom:6px;border-radius:10px;border-left:3px solid currentColor;background:rgba(0,0,0,0.12);cursor:pointer;max-width:100%;}
.msg-row:not(.self) .msg-reply-quote{background:rgba(255,255,255,0.06);}
.msg-reply-quote-author{font-size:11px;font-weight:800;opacity:.85;}
.msg-reply-quote-text{font-size:12px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.msg-forwarded-tag{font-size:10.5px;font-weight:700;opacity:.6;display:flex;align-items:center;gap:4px;margin-bottom:2px;}
.msg-forwarded-tag svg{width:11px;height:11px;}
.msg-edited-tag{font-size:10px;opacity:.55;margin-left:4px;font-style:italic;}
.msg-ticks{display:inline-flex;margin-left:3px;vertical-align:-2px;}
.msg-ticks svg{width:14px;height:14px;}
.msg-pinned-icon{opacity:.55;display:inline-flex;margin-left:4px;}
.msg-pinned-icon svg{width:11px;height:11px;}
.msg-link{color:inherit;text-decoration:underline;}
.msg-code{background:rgba(0,0,0,.18);padding:1px 5px;border-radius:5px;font-size:.9em;font-family:monospace;}
.reply-preview-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--glass-border);background:var(--bg2);animation:fadeUp .2s ease;flex-shrink:0;}
.reply-preview-bar .rp-bar{width:3px;align-self:stretch;border-radius:2px;background:var(--accent);}
.reply-preview-bar .rp-body{flex:1;min-width:0;}
.reply-preview-bar .rp-title{font-size:11.5px;font-weight:800;color:var(--accent);}
.reply-preview-bar .rp-text{font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.reply-preview-close{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass-bg);flex-shrink:0;cursor:pointer;}
.reply-preview-close svg{width:14px;height:14px;}
.pinned-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--glass-border);cursor:pointer;flex-shrink:0;animation:fadeUp .25s ease;}
.pinned-banner svg{width:16px;height:16px;color:var(--accent);flex-shrink:0;}
.pinned-banner .pb-body{flex:1;min-width:0;}
.pinned-banner .pb-title{font-size:10.5px;font-weight:800;color:var(--dim);}
.pinned-banner .pb-text{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.scroll-bottom-fab{position:absolute;right:14px;bottom:78px;width:40px;height:40px;border-radius:50%;background:var(--bg2);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;animation:popIn2 .2s cubic-bezier(.34,1.56,.64,1);z-index:4;}
@keyframes popIn2{from{opacity:0;transform:scale(.5);}to{opacity:1;transform:scale(1);}}
.scroll-bottom-fab svg{width:17px;height:17px;transform:rotate(90deg);}
.char-counter{font-size:10.5px;color:var(--dim);padding:0 16px 4px;text-align:right;flex-shrink:0;}
.char-counter.warn{color:var(--danger);}
.action-sheet-quickrow{display:flex;justify-content:space-between;gap:6px;padding:2px 4px 16px;}
.action-sheet-emoji{font-size:24px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:transform .15s,background .15s;}
.action-sheet-emoji:active{transform:scale(1.25);background:var(--glass-bg);}
.action-sheet-item{display:flex;align-items:center;gap:14px;padding:13px 6px;cursor:pointer;border-bottom:1px solid var(--glass-border);transition:background .15s;}
.action-sheet-item:active{background:var(--glass-bg);}
.action-sheet-item:last-child{border-bottom:none;}
.action-sheet-item svg{width:19px;height:19px;color:var(--text);flex-shrink:0;}
.action-sheet-item span{font-size:14.5px;font-weight:600;}
.action-sheet-item.danger svg,.action-sheet-item.danger span{color:var(--danger);}
.action-sheet-preview{padding:0 6px 14px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--glass-border);margin-bottom:4px;max-height:60px;overflow:hidden;text-overflow:ellipsis;}
.bg-swatch-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.bg-swatch{aspect-ratio:1;border-radius:16px;cursor:pointer;position:relative;border:2px solid transparent;transition:transform .15s;}
.bg-swatch:active{transform:scale(.92);}
.bg-swatch.active{border-color:var(--text);}
.profile-cover{position:absolute;top:0;left:0;right:0;height:150px;cursor:pointer;-webkit-mask-image:linear-gradient(to bottom,black 55%,transparent 100%);mask-image:linear-gradient(to bottom,black 55%,transparent 100%);}
.profile-cover-edit{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:rgba(0,0,0,0.45);backdrop-filter:blur(8px);font-size:11.5px;font-weight:700;cursor:pointer;color:#fff;}
.profile-cover-edit svg{width:13px;height:13px;}
.profile-hero{position:relative;overflow:visible;padding:0 20px 22px;flex-shrink:0;}
.profile-hero-content{position:relative;z-index:2;padding-top:95px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.channel-star{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:var(--dim);transition:transform .15s;}
.channel-star:active{transform:scale(1.3);}
.channel-star.on{color:#facc15;}
.channel-star svg{width:16px;height:16px;}
.chat-search-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--glass-border);flex-shrink:0;animation:fadeUp .2s ease;}
.chat-search-bar input{flex:1;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:8px 14px;color:var(--text);font-size:13.5px;font-family:'Manrope',sans-serif;outline:none;}
.chat-search-bar svg{width:17px;height:17px;color:var(--dim);flex-shrink:0;}
.accent-custom-row{display:flex;align-items:center;gap:12px;padding:12px 4px;}
.accent-custom-row input[type=color]{width:44px;height:44px;border-radius:12px;border:none;background:none;cursor:pointer;}


/* ===== LIVELINESS PASS: nav, chips, customization, motion everywhere ===== */
.nav-pill{position:absolute;top:6px;width:44px;height:44px;border-radius:16px;background:var(--glass-border);transition:left .38s cubic-bezier(.22,1,.36,1);z-index:0;}
.nav-item{z-index:1;}
.nav-item.no-label{gap:0;}
.nav-item.no-label .nav-label{display:none;}
.nav-item:active svg{transform:scale(.82);}
.nav-badge{animation:badgePulse 1.8s ease-in-out infinite;}
@keyframes badgePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:8px 14px;border-radius:14px;background:var(--glass-bg);border:1px solid var(--glass-border);font-size:12.5px;font-weight:700;color:var(--dim);cursor:pointer;transition:all .2s cubic-bezier(.22,1,.36,1);}
.chip:active{transform:scale(.94);}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border-color:transparent;box-shadow:0 4px 14px -4px rgba(255,255,255,.3);}

.btn-logout-sm{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:16px;background:rgba(255,92,92,.12);border:1px solid rgba(255,92,92,.3);color:#ff8a8a;font-size:12.5px;font-weight:700;cursor:pointer;transition:transform .15s,background .15s;}
.btn-logout-sm svg{width:14px;height:14px;}
.btn-logout-sm:active{transform:scale(.95);background:rgba(255,92,92,.2);}

/* customization: avatar shape */
body.shape-squircle .profile-avatar{border-radius:24px;}
body.shape-squircle .msg-avatar{border-radius:11px;}
body.shape-squircle .avatar-picker{border-radius:24px;}
body.shape-squircle .server-avatar{border-radius:18px;}

/* customization: bubble style */
body.bubble-sharp .msg-bubble{border-radius:6px;}
body.bubble-sharp .msg-row.self .msg-bubble{border-bottom-right-radius:2px;}
body.bubble-sharp .msg-row:not(.self) .msg-bubble{border-bottom-left-radius:2px;}

/* customization: font size */
body.fs-small .msg-bubble{font-size:13px;}
body.fs-small .profile-name{font-size:18px;}
body.fs-large .msg-bubble{font-size:16.5px;}
body.fs-large .profile-name{font-size:24px;}
body.fs-large .chat-textbox{font-size:15.5px;}

/* customization: reduced glow */
body.no-glow .btn,body.no-glow .profile-avatar,body.no-glow .send-btn,body.no-glow .eclipse-corona{box-shadow:none !important;}

/* customization: compact density */
body.density-compact .msg-bubble{padding:6px 10px;}
body.density-compact .msg-row{margin-bottom:2px;}
body.density-compact .setting-row{padding:9px 0;}

/* liveliness: entrance + press feedback everywhere */
.msg-row{animation:msgPopIn .28s cubic-bezier(.22,1,.36,1) both;}
@keyframes msgPopIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.chan-row,.server-row,.setting-row,.notif-row,.theme-card,.bg-swatch,.action-sheet-item{transition:transform .15s ease,background .15s ease;}
.chan-row:active,.server-row:active,.setting-row:active,.notif-row:active{transform:scale(.985);}
.role-badge{animation:fadeUp .4s ease .1s both;}
.reaction-chip{animation:popIn2 .25s cubic-bezier(.34,1.56,.64,1);}
.theme-dot{transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.theme-card:active .theme-dot{transform:scale(1.15) rotate(8deg);}
.status-dot{position:relative;}
.status-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid currentColor;opacity:.5;animation:dotPulse 2s ease-out infinite;}
@keyframes dotPulse{0%{transform:scale(.6);opacity:.6;}100%{transform:scale(1.9);opacity:0;}}
.send-btn{transition:transform .18s cubic-bezier(.34,1.56,.64,1),opacity .15s;}
.send-btn:active{transform:scale(.82) rotate(-8deg);}
.locked-input-note,.pinned-banner,.reply-preview-bar,.chat-search-bar{animation:fadeUp .25s cubic-bezier(.22,1,.36,1);}
.typing-dot{animation:typingBounce 1.2s ease-in-out infinite;}
.section-label{animation:fadeUp .35s ease both;}


/* ===== DISCORD-STYLE SERVER RAIL ===== */
.server-rail{position:fixed;top:0;left:0;bottom:82px;width:60px;z-index:25;display:flex;flex-direction:column;align-items:center;gap:8px;padding:52px 0 12px;overflow-y:auto;overflow-x:visible;background:var(--bg2);border-right:1px solid var(--glass-border);scrollbar-width:none;}
.server-rail::-webkit-scrollbar{display:none;}
.rail-item{width:46px;height:46px;border-radius:50%;background:var(--glass-bg);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;overflow:hidden;transition:border-radius .25s cubic-bezier(.22,1,.36,1),background .25s;font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;color:var(--text);}
.rail-item svg{width:20px;height:20px;}
.rail-item img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.rail-item:active{transform:scale(.92);}
.rail-item.active{border-radius:16px;}
.rail-item.home{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;}
.rail-item.home.active{border-radius:16px;}
.rail-item:not(.home):not(.add){background:linear-gradient(135deg,var(--accent2),var(--accent));color:#000;}
.rail-item.muted{opacity:.5;}
.rail-pill{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:4px;height:8px;border-radius:0 4px 4px 0;background:#fff;transition:height .2s ease,opacity .2s ease;opacity:0;}
.rail-item.active .rail-pill{height:24px;opacity:1;}
.rail-item:not(.active):hover .rail-pill{height:12px;opacity:.6;}
.rail-sep{width:28px;height:2px;background:var(--glass-border);border-radius:1px;flex-shrink:0;}
.rail-item.add{background:transparent;border:1.5px dashed var(--glass-border);color:var(--dim);}
.rail-dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;background:#ff5c5c;border:2px solid var(--bg2);}
body.has-rail .screen-wrap{left:60px;transition:left .32s cubic-bezier(.22,1,.36,1);}
body.has-rail .bottom-nav{left:60px;transition:left .32s cubic-bezier(.22,1,.36,1);}
body.has-rail.rail-collapsed .screen-wrap{left:0;}
body.has-rail.rail-collapsed .bottom-nav{left:0;}
.server-rail{transition:transform .32s cubic-bezier(.22,1,.36,1),left .32s cubic-bezier(.22,1,.36,1);}
body.rail-collapsed .server-rail{transform:translateX(-100%);}
.rail-toggle{position:fixed;top:56px;left:60px;z-index:26;width:20px;height:38px;background:var(--bg2);border:1px solid var(--glass-border);border-left:none;border-radius:0 12px 12px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:left .32s cubic-bezier(.22,1,.36,1),transform .15s;}
.rail-toggle:active{transform:scale(.88);}
.rail-toggle svg{width:11px;height:11px;transform:rotate(180deg);transition:transform .32s ease;}
body.rail-collapsed .rail-toggle{left:0;}
body.rail-collapsed .rail-toggle svg{transform:rotate(0deg);}
body:not(.has-rail) .rail-toggle{display:none;}

</style>
